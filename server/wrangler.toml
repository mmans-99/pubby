# Cloudflare settings for the online-play relay (CODE.md 9r.3.6).
# Deploy: the GitHub workflow .github/workflows/server.yml does it on push.
name = "pubby-rooms"
main = "src/index.ts"
compatibility_date = "2026-11-13"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
# SQLite-backed objects: the only kind the free plan allows.
new_sqlite_classes = ["Room", "Directory"]

[vars]
ALLOWED_ORIGINS = "https://mmans-99.github.io"
