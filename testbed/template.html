<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pubby testbed</title>
<style>
  :root { --bg:#10261a; --panel:#1b3a28; --ink:#f3f6f1; --muted:#a9bcae; --accent:#ffcc33; --red:#d62f2f; --line:#2e5a40; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui, -apple-system, sans-serif; }
  #app { max-width:720px; margin:0 auto; padding:12px 12px 80px; }
  h1 { font-size:26px; margin:8px 0; } h2 { font-size:20px; margin:16px 0 6px; } h3 { font-size:15px; margin:14px 0 6px; color:var(--muted); }
  .note { color:var(--muted); font-size:13px; margin:4px 0; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0; }
  .w { min-width:40px; font-weight:600; }
  button { font:inherit; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px 14px; min-height:44px; cursor:pointer; }
  button.small { padding:6px 10px; min-height:36px; font-size:14px; }
  button.on { background:var(--accent); color:#1a1a1a; border-color:var(--accent); }
  button.go { background:var(--accent); color:#1a1a1a; font-weight:700; width:100%; }
  button.warn { border-color:#c55; color:#ffb3b3; }
  button:disabled { cursor:default; }
  input { font:inherit; padding:10px; border-radius:10px; border:1px solid var(--line); background:#0c1d14; color:var(--ink); width:110px; min-height:44px; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .scores { display:flex; flex-wrap:wrap; gap:10px; margin:6px 0; font-size:14px; color:var(--muted); }
  .hand { background:var(--panel); border:2px solid transparent; border-radius:12px; padding:8px; margin:8px 0; }
  .hand.turn { border-color:var(--accent); }
  .who { font-size:14px; margin-bottom:6px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .cards { display:flex; flex-wrap:wrap; gap:5px; }
  .card { background:#fff; color:#111; border:1px solid #bbb; border-radius:8px; min-width:46px; min-height:52px; padding:4px 6px; font-weight:700; font-size:16px; }
  .card.red { color:var(--red); }
  .card.joker { background:#ffe9a8; color:#7a4b00; font-size:13px; }
  .card.legal { box-shadow:0 0 0 3px var(--accent); }
  .card.dim { opacity:.35; }
  .card.picked { background:var(--accent); }
  .table { background:#0c1d14; border-radius:12px; padding:10px; margin:8px 0; font-size:14px; }
  .trick { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .tp { display:flex; align-items:center; gap:4px; }
  .choice { background:#3a2a10; border:2px solid var(--accent); border-radius:12px; padding:10px; margin:8px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  table { width:100%; border-collapse:collapse; margin:8px 0; } td,th { padding:8px; border-bottom:1px solid var(--line); text-align:left; }
  .log { background:#0c1d14; border-radius:12px; padding:8px; font-size:13px; max-height:320px; overflow:auto; }
  .log div { padding:3px 0; border-bottom:1px solid #18301f; }
  .popup { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:10; }
  .popup > div { background:var(--accent); color:#1a1a1a; font-weight:800; font-size:24px; text-align:center; padding:24px 20px; border-radius:18px; max-width:420px; transform:rotate(-2deg); box-shadow:6px 6px 0 #000; }
  .popup small { display:block; font-size:12px; font-weight:400; margin-top:12px; }
  .popup .ptitle { font-size:26px; line-height:1.15; }
  .popup .pline { font-size:16px; font-weight:600; margin-top:6px; }
  .popup .pline.first { font-size:18px; }
  .popup.slap > div { background:#e8202a; color:#fff; border:4px solid #fff; animation: slap .45s ease-out; }
  .popup.slap .ptitle { font-size:64px; letter-spacing:2px; text-shadow:4px 4px 0 #000; font-style:italic; }
  .popup.slap .pline.first { font-size:20px; }
  .popup.out > div { background:#3ccf6e; }
  .popup.end > div { background:#fff; }
  .popup.end .pline:nth-child(3) { color:#d62f2f; font-size:22px; font-weight:900; }
  @keyframes slap { 0% { transform:scale(.3) rotate(-20deg); } 60% { transform:scale(1.15) rotate(4deg); } 80% { transform:translateX(-8px) rotate(-3deg); } 100% { transform:scale(1) rotate(-2deg); } }
  .place { background:var(--accent); color:#1a1a1a; border-radius:8px; padding:1px 7px; font-weight:800; font-size:13px; }
  .place.loser { background:#d62f2f; color:#fff; }
  .winner { font-size:22px; font-weight:800; color:var(--accent); margin:4px 0 8px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/*BUNDLE*/
</script>
</body>
</html>
